<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Our Memory Photobooth ★</title>
  <style>
    :root {
      --bg: #0e0e13;
      --card-bg: #1a1a24;
      --accent: #ff4d88;
      --accent-soft: #ff85aa;
      --text: #ffffff;
      --text-muted: #9595a8;
      --border-color: #2b2b3a;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 16px) 14px env(safe-area-inset-bottom, 16px);
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px 14px;
    }
    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(45deg, #ff4d88, #ffb3c6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-actions { display: flex; gap: 8px; }
    .pill-btn {
      background: #242433;
      border: 1px solid var(--border-color);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 13px;
      border-radius: 20px;
      cursor: pointer;
    }
    .pill-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }
    .booth-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .viewfinder-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.65), inset 0 0 0 1px rgba(255,255,255,0.1);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      transition: filter 0.2s ease, -webkit-filter 0.2s ease;
    }
    video.no-mirror { transform: scaleX(1); }
    
    .flash-overlay {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease-out;
      z-index: 10;
    }
    .flash-overlay.active { opacity: 1; }
    
    .countdown-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 8rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 4px 28px rgba(0,0,0,0.7);
      pointer-events: none;
      opacity: 0;
      transform: scale(0.5);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s;
      z-index: 11;
    }
    .countdown-overlay.show { opacity: 1; transform: scale(1); }
    
    .status-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 9;
    }
    .kiosk-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 12;
      cursor: pointer;
    }
    .kiosk-overlay.active { display: flex; }
    .kiosk-banner {
      background: var(--accent);
      color: #fff;
      font-size: 1.5rem;
      font-weight: 800;
      padding: 18px 36px;
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(255,77,136,0.5);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .toolbar-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      width: 100%;
      padding: 2px;
      scrollbar-width: none;
    }
    .toolbar-row::-webkit-scrollbar { display: none; }
    
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 16px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }

    .shutter-row {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0;
    }
    .round-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      cursor: pointer;
    }
    .shutter-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      border: 6px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 77, 136, 0.4);
    }
    .shutter-inner {
      width: 56px;
      height: 56px;
      background: var(--accent);
      border-radius: 50%;
      transition: transform 0.1s;
    }
    .shutter-btn:active .shutter-inner { transform: scale(0.85); }

    /* Studio Modal */
    .studio-modal {
      position: fixed;
      inset: 0;
      background: rgba(8, 8, 12, 0.95);
      backdrop-filter: blur(18px);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 16px) 14px env(safe-area-inset-bottom, 16px);
      overflow-y: auto;
    }
    .studio-modal.active { display: flex; }
    
    .canvas-container {
      position: relative;
      max-height: 46vh;
      display: flex;
      justify-content: center;
      margin: 6px 0;
    }
    .strip-preview {
      max-height: 46vh;
      max-width: 92%;
      border-radius: 12px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.85);
      object-fit: contain;
    }
    #doodleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      border-radius: 12px;
      display: none;
    }
    #doodleCanvas.active { display: block; }

    .editor-card {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }
    .section-label {
      font-size: 0.73rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 7px;
    }
    .thumbs-row { display: flex; gap: 8px; overflow-x: auto; }
    .thumb-wrap {
      position: relative;
      flex-shrink: 0;
      width: 68px;
      height: 52px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
    }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-retake-badge {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 800;
      color: #ff99c8;
      opacity: 0;
    }
    .thumb-wrap:hover .thumb-retake-badge, .thumb-wrap:active .thumb-retake-badge { opacity: 1; }

    .mood-tabs-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .mood-tabs-bar::-webkit-scrollbar { display: none; }
    .mood-tab {
      background: #252535;
      border: 1px solid #36364c;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .mood-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    
    .frame-themes-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 0;
    }
    .frame-themes-scroll::-webkit-scrollbar { display: none; }

    .chip-btn {
      background: #242433;
      border: 1px solid #38384d;
      color: #fff;
      font-size: 0.76rem;
      padding: 6px 12px;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .chip-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .sticker-tray {
      display: flex;
      gap: 12px;
      font-size: 1.45rem;
      overflow-x: auto;
      padding: 4px 0;
    }
    .sticker-item { cursor: pointer; transition: transform 0.15s; }
    .sticker-item:active { transform: scale(1.35); }

    .input-field {
      background: #121217;
      border: 1px solid #323242;
      color: #fff;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
    }
    .button-group {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 4px;
    }
    .action-btn {
      flex: 1;
      padding: 13px;
      border-radius: 14px;
      border: none;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-main { background: var(--accent); color: #fff; }
    .btn-sub { background: #262635; color: #fff; }
  </style>
</head>
<body>

  <header id="mainHeader">
    <div class="brand-title">💖 OUR PHOTOBOOTH</div>
    <div class="header-actions">
      <button class="pill-btn" id="timerToggle">⏱ 3s</button>
      <button class="pill-btn" id="soundToggle">🔊 On</button>
      <button class="pill-btn" id="kioskBtn">Party</button>
    </div>
  </header>

  <div class="booth-container">
    <div class="viewfinder-wrapper" id="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <div class="flash-overlay" id="flash"></div>
      <div class="countdown-overlay" id="countdown">3</div>
      <div class="status-badge" id="shotBadge" style="display:none;">SHOT 1 / 4</div>
      <div class="kiosk-overlay" id="kioskOverlay">
        <div class="kiosk-banner">TOUCH TO START ★</div>
      </div>
    </div>

    <!-- Live Filter Selection -->
    <div class="toolbar-row" id="filtersBar">
      <button class="filter-btn active" data-style="disposable">📸 90s Flash</button>
      <button class="filter-btn" data-style="halation">✨ Soft Bloom</button>
      <button class="filter-btn" data-style="natural">Natural</button>
      <button class="filter-btn" data-style="haru">Haru B&amp;W</button>
      <button class="filter-btn" data-style="vintage35">🎞 35mm Film</button>
    </div>

    <!-- Shutter Controls -->
    <div class="shutter-row" id="shutterRow">
      <button class="round-btn" id="flipCamBtn" title="Switch Camera">↻</button>
      <div class="shutter-btn" id="startShutterBtn">
        <div class="shutter-inner"></div>
      </div>
      <button class="round-btn" id="mirrorToggleBtn" title="Toggle Mirror">⇄</button>
    </div>
  </div>

  <!-- Studio Customization Modal -->
  <div class="studio-modal" id="studioModal">
    <div class="canvas-container">
      <img id="previewImg" class="strip-preview" alt="Our Photobooth Strip" />
      <canvas id="doodleCanvas"></canvas>
    </div>

    <div class="editor-card">
      <!-- Retake Thumbnails -->
      <div>
        <div class="section-label">RETAKE ANY SHOT</div>
        <div class="thumbs-row" id="thumbsRow"></div>
      </div>

      <!-- Change Filter inside Studio Review -->
      <div>
        <div class="section-label">PHOTO FILTER</div>
        <div class="frame-themes-scroll" id="studioFiltersRow">
          <button class="chip-btn active" data-studio-style="disposable">📸 90s Flash</button>
          <button class="chip-btn" data-studio-style="halation">✨ Soft Bloom</button>
          <button class="chip-btn" data-studio-style="natural">Natural</button>
          <button class="chip-btn" data-studio-style="haru">Haru B&amp;W</button>
          <button class="chip-btn" data-studio-style="vintage35">🎞 35mm Film</button>
        </div>
      </div>

      <!-- THEMED FRAMES & BORDERS -->
      <div>
        <div class="section-label">CHOOSE A BORDER MOOD</div>
        <div class="mood-tabs-bar" id="moodTabs">
          <button class="mood-tab active" data-mood="romantic">💖 Romantic</button>
          <button class="mood-tab" data-mood="cute">🎀 Cute</button>
          <button class="mood-tab" data-mood="y2k">🛸 Y2K</button>
          <button class="mood-tab" data-mood="seasonal">🌸 Seasonal</button>
          <button class="mood-tab" data-mood="minimal">🌿 Minimal</button>
        </div>

        <div class="frame-themes-scroll" id="themeButtonsRow" style="margin-top:8px;">
          <!-- Dynamically populated based on chosen mood -->
        </div>
      </div>

      <!-- Strip Layout Options -->
      <div>
        <div class="section-label">STRIP LAYOUT</div>
        <div class="frame-themes-scroll">
          <button class="chip-btn active" data-layout="strip">1×4 Strip</button>
          <button class="chip-btn" data-layout="twin">2×4 Twin Print</button>
          <button class="chip-btn" data-layout="grid">2×2 Grid</button>
          <button class="chip-btn" data-layout="polaroid">Polaroid Memory</button>
        </div>
      </div>

      <!-- Stickers & Signature Doodle -->
      <div>
        <div class="section-label">STICKERS &amp; SIGNATURE</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="sticker-tray">
            <span class="sticker-item" data-emoji="🎀">🎀</span>
            <span class="sticker-item" data-emoji="💖">💖</span>
            <span class="sticker-item" data-emoji="🍓">🍓</span>
            <span class="sticker-item" data-emoji="🧸">🧸</span>
            <span class="sticker-item" data-emoji="🌸">🌸</span>
            <span class="sticker-item" data-emoji="✨">✨</span>
            <span class="sticker-item" data-emoji="💌">💌</span>
            <span class="sticker-item" data-emoji="🍒">🍒</span>
          </div>
          <button class="chip-btn" id="doodleToggleBtn">✏️ Draw</button>
        </div>
      </div>

      <!-- Couple / Friend Customization -->
      <div>
        <div class="section-label">OUR NAMES &amp; DATE STAMP</div>
        <div style="display:flex; gap:8px;">
          <input type="text" class="input-field" id="titleInput" placeholder="Our Names (e.g. BB & Au)" value="BB & AU" maxlength="20" style="flex:1;" />
          <input type="text" class="input-field" id="subtitleInput" placeholder="Subtitle (e.g. Special Day)" value="OUR MEMORIES" maxlength="22" style="flex:1;" />
        </div>
      </div>

      <!-- Actions -->
      <div class="button-group">
        <button class="action-btn btn-sub" id="retakeAllBtn">New Session</button>
        <button class="action-btn btn-main" id="saveShareBtn">Save to Photos / Share</button>
      </div>
    </div>
  </div>

  <canvas id="renderCanvas" style="display:none;"></canvas>

  <script>
    const BORDER_THEMES = {
      romantic: [
        { id: 'ribbons', name: '🎀 Pink Ribbons', bg: '#fdf9f7', text: '#d94b76', accent: '#ff85aa' },
        { id: 'lace', name: '🤍 Rose Lace', bg: '#ffeef2', text: '#ad3357', accent: '#ffffff' },
        { id: 'cupid', name: '💘 Cupid Love', bg: '#4a0e1c', text: '#ffffff', accent: '#ffb3c6' },
        { id: 'heartstrings', name: '💌 Heart Strings', bg: '#ffffff', text: '#ff4d88', accent: '#ffd6e0' }
      ],
      cute: [
        { id: 'strawberry', name: '🍓 Strawberry Milk', bg: '#fff0f3', text: '#c9184a', accent: '#ff758f' },
        { id: 'teddy', name: '🧸 Teddy Bear', bg: '#fbf5ee', text: '#7f5539', accent: '#ddb892' },
        { id: 'cherry', name: '🍒 Cherry Pop', bg: '#e8f5e9', text: '#c1121f', accent: '#52b788' },
        { id: 'polka', name: '⚪️ Pastel Polka', bg: '#e0f2fe', text: '#0369a1', accent: '#ffffff' }
      ],
      y2k: [
        { id: 'chromestars', name: '🛸 Cyber Chrome', bg: '#111116', text: '#f1f5f9', accent: '#38bdf8' },
        { id: 'angelwings', name: '🪽 Angel Aura', bg: '#f3e8ff', text: '#7e22ce', accent: '#c084fc' },
        { id: 'pixelheart', name: '👾 Pixel Love', bg: '#09090b', text: '#22c55e', accent: '#ec4899' }
      ],
      seasonal: [
        { id: 'sakura', name: '🌸 Spring Sakura', bg: '#fff5f7', text: '#db2777', accent: '#fbcfe8' },
        { id: 'autumn', name: '🍂 Autumn Cafe', bg: '#fef3c7', text: '#92400e', accent: '#d97706' },
        { id: 'winter', name: '❄️ Starlight Snow', bg: '#0f172a', text: '#e2e8f0', accent: '#93c5fd' }
      ],
      minimal: [
        { id: 'gallery', name: '🏛 Gallery Linen', bg: '#f9f8f6', text: '#1c1917', accent: '#78716c' },
        { id: 'film35', name: '🎞 35mm Sprocket', bg: '#0b0b0e', text: '#ffffff', accent: '#f59e0b' },
        { id: 'noir', name: '🖤 Modern Noir', bg: '#18181b', text: '#ffffff', accent: '#a1a1aa' }
      ]
    };

    let currentMood = 'romantic';
    let currentThemeId = 'ribbons';
    let currentLayout = 'strip';
    let currentPhotoStyle = 'disposable';
    let timerDuration = 3;
    let soundEnabled = true;
    let facingMode = 'user';
    let isMirrored = true;

    let rawCapturedFrames = [];
    let placedStickers = [];
    let retargetShotIndex = -1;
    let isDrawing = false;
    let doodleMode = false;
    let audioCtx = null;
    let currentStream = null;

    const video = document.getElementById('video');
    const flash = document.getElementById('flash');
    const countdown = document.getElementById('countdown');
    const shotBadge = document.getElementById('shotBadge');
    const startShutterBtn = document.getElementById('startShutterBtn');
    const flipCamBtn = document.getElementById('flipCamBtn');
    const mirrorToggleBtn = document.getElementById('mirrorToggleBtn');
    const timerToggle = document.getElementById('timerToggle');
    const soundToggle = document.getElementById('soundToggle');
    const kioskBtn = document.getElementById('kioskBtn');
    const kioskOverlay = document.getElementById('kioskOverlay');
    const studioModal = document.getElementById('studioModal');
    const previewImg = document.getElementById('previewImg');
    const thumbsRow = document.getElementById('thumbsRow');
    const moodTabs = document.getElementById('moodTabs');
    const themeButtonsRow = document.getElementById('themeButtonsRow');
    const titleInput = document.getElementById('titleInput');
    const subtitleInput = document.getElementById('subtitleInput');
    const doodleCanvas = document.getElementById('doodleCanvas');
    const doodleToggleBtn = document.getElementById('doodleToggleBtn');
    const retakeAllBtn = document.getElementById('retakeAllBtn');
    const saveShareBtn = document.getElementById('saveShareBtn');
    const renderCanvas = document.getElementById('renderCanvas');

    // 1. REAL-TIME VIEWFINDER FILTER ENGINE
    function updateLiveFilter(style) {
      currentPhotoStyle = style;
      const liveCssFilters = {
        natural: 'none',
        disposable: 'contrast(1.25) saturate(1.3) brightness(1.05)',
        halation: 'brightness(1.12) contrast(0.98) saturate(1.2)',
        haru: 'grayscale(1) contrast(1.4) brightness(0.95)',
        vintage35: 'sepia(0.45) contrast(1.15) saturate(0.9) brightness(0.95)'
      };
      const cssVal = liveCssFilters[style] || 'none';
      video.style.filter = cssVal;
      video.style.webkitFilter = cssVal;

      // Sync active state on all buttons
      document.querySelectorAll('[data-style]').forEach(b => {
        b.classList.toggle('active', b.dataset.style === style);
      });
      document.querySelectorAll('[data-studio-style]').forEach(b => {
        b.classList.toggle('active', b.dataset.studioStyle === style);
      });

      if (studioModal.classList.contains('active')) {
        buildStudioCollage();
      }
    }

    // Audio Engine
    function playBeep(freq = 600, duration = 0.08) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function triggerFlash() {
      playBeep(1200, 0.12);
      flash.classList.add('active');
      setTimeout(() => flash.classList.remove('active'), 120);
    }

    async function startCamera() {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      try {
        const constraints = {
          video: { facingMode: facingMode, width: { ideal: 1920 }, height: { ideal: 1440 } },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        await video.play();
        updateLiveFilter(currentPhotoStyle);
      } catch (err) {
        alert("Camera permission required in Safari.");
      }
    }

    function updateMirror() {
      if (isMirrored) video.classList.remove('no-mirror');
      else video.classList.add('no-mirror');
    }

    flipCamBtn.addEventListener('click', () => {
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      isMirrored = (facingMode === 'user');
      updateMirror();
      startCamera();
    });

    mirrorToggleBtn.addEventListener('click', () => {
      isMirrored = !isMirrored;
      updateMirror();
    });

    timerToggle.addEventListener('click', () => {
      timerDuration = (timerDuration === 3) ? 5 : (timerDuration === 5 ? 7 : 3);
      timerToggle.innerText = `⏱ ${timerDuration}s`;
    });

    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundToggle.innerText = soundEnabled ? '🔊 On' : '🔇 Mute';
    });

    kioskBtn.addEventListener('click', () => kioskOverlay.classList.toggle('active'));
    kioskOverlay.addEventListener('click', () => {
      kioskOverlay.classList.remove('active');
      runSession();
    });

    // Filter Buttons in Camera View
    document.querySelectorAll('#filtersBar .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => updateLiveFilter(btn.dataset.style));
    });

    // Filter Buttons in Studio Review Modal
    document.querySelectorAll('[data-studio-style]').forEach(btn => {
      btn.addEventListener('click', () => updateLiveFilter(btn.dataset.studioStyle));
    });

    // Capture Raw Frame
    function captureRawFrame() {
      const c = document.createElement('canvas');
      const w = video.videoWidth;
      const h = video.videoHeight;
      let targetW = w, targetH = Math.floor(w * 0.75);
      if (targetH > h) {
        targetH = h;
        targetW = Math.floor(h * 1.333);
      }
      c.width = 900;
      c.height = 675;
      const ctx = c.getContext('2d');

      if (isMirrored) {
        ctx.translate(c.width, 0);
        ctx.scale(-1, 1);
      }
      const sx = (w - targetW) / 2;
      const sy = (h - targetH) / 2;
      ctx.drawImage(video, sx, sy, targetW, targetH, 0, 0, c.width, c.height);
      return c;
    }

    async function runSession() {
      if (retargetShotIndex === -1) rawCapturedFrames = [];
      const totalShots = (retargetShotIndex !== -1) ? 1 : 4;
      shotBadge.style.display = 'block';

      for (let i = 0; i < totalShots; i++) {
        const shotNumber = (retargetShotIndex !== -1) ? (retargetShotIndex + 1) : (i + 1);
        shotBadge.innerText = `SHOT ${shotNumber} / 4`;

        for (let s = timerDuration; s >= 1; s--) {
          countdown.innerText = s;
          countdown.classList.add('show');
          playBeep(520, 0.08);
          await new Promise(r => setTimeout(r, 900));
          countdown.classList.remove('show');
          await new Promise(r => setTimeout(r, 100));
        }

        triggerFlash();
        const frame = captureRawFrame();

        if (retargetShotIndex !== -1) rawCapturedFrames[retargetShotIndex] = frame;
        else rawCapturedFrames.push(frame);

        await new Promise(r => setTimeout(r, 600));
      }

      retargetShotIndex = -1;
      shotBadge.style.display = 'none';
      buildStudioCollage();
      studioModal.classList.add('active');
    }

    startShutterBtn.addEventListener('click', () => runSession());
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && !studioModal.classList.contains('active')) {
        e.preventDefault();
        runSession();
      }
    });

    function updateThumbs() {
      thumbsRow.innerHTML = '';
      rawCapturedFrames.forEach((frame, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'thumb-wrap';
        wrap.innerHTML = `<img src="${frame.toDataURL()}" /><div class="thumb-retake-badge">RETAKE</div>`;
        wrap.addEventListener('click', () => {
          retargetShotIndex = idx;
          studioModal.classList.remove('active');
          runSession();
        });
        thumbsRow.appendChild(wrap);
      });
    }

    function renderMoodButtons() {
      themeButtonsRow.innerHTML = '';
      const themes = BORDER_THEMES[currentMood] || [];
      themes.forEach((th) => {
        const btn = document.createElement('button');
        btn.className = `chip-btn ${th.id === currentThemeId ? 'active' : ''}`;
        btn.innerText = th.name;
        btn.addEventListener('click', () => {
          document.querySelectorAll('#themeButtonsRow .chip-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentThemeId = th.id;
          buildStudioCollage();
        });
        themeButtonsRow.appendChild(btn);
      });
    }

    document.querySelectorAll('#moodTabs .mood-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#moodTabs .mood-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMood = tab.dataset.mood;
        const available = BORDER_THEMES[currentMood];
        if (available && available.length > 0) currentThemeId = available[0].id;
        renderMoodButtons();
        buildStudioCollage();
      });
    });

    document.querySelectorAll('[data-layout]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-layout]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLayout = btn.dataset.layout;
        buildStudioCollage();
      });
    });

    titleInput.addEventListener('input', () => buildStudioCollage());
    subtitleInput.addEventListener('input', () => buildStudioCollage());

    // 2. UNIVERSAL CANVAS PIXEL FILTER ENGINE (Guaranteed on all iOS WebKit versions)
    function processPhoto(raw) {
      const c = document.createElement('canvas');
      c.width = raw.width;
      c.height = raw.height;
      const ctx = c.getContext('2d');
      const w = c.width, h = c.height;

      ctx.drawImage(raw, 0, 0);

      if (currentPhotoStyle !== 'natural') {
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;

        if (currentPhotoStyle === 'haru') {
          // Authentic High-Contrast Studio B&W
          for (let i = 0; i < d.length; i += 4) {
            let gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
            gray = (gray - 128) * 1.45 + 128; // boost contrast
            gray = gray < 0 ? 0 : (gray > 255 ? 255 : gray);
            d[i] = gray;
            d[i+1] = gray;
            d[i+2] = gray;
          }
          ctx.putImageData(imgData, 0, 0);

        } else if (currentPhotoStyle === 'vintage35') {
          // 35mm Warm Sepia Analog
          for (let i = 0; i < d.length; i += 4) {
            let r = d[i], g = d[i+1], b = d[i+2];
            d[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
            d[i+1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
            d[i+2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
          }
          ctx.putImageData(imgData, 0, 0);

        } else if (currentPhotoStyle === 'disposable') {
          // 90s Flash Look: high contrast and warm saturation pop
          for (let i = 0; i < d.length; i += 4) {
            let r = (d[i] - 128) * 1.25 + 128;
            let g = (d[i+1] - 128) * 1.25 + 128;
            let b = (d[i+2] - 128) * 1.25 + 128;
            r = r * 1.08;
            b = b * 0.94;
            d[i] = Math.min(255, Math.max(0, r));
            d[i+1] = Math.min(255, Math.max(0, g));
            d[i+2] = Math.min(255, Math.max(0, b));
          }
          ctx.putImageData(imgData, 0, 0);

        } else if (currentPhotoStyle === 'halation') {
          // Soft studio skin glow
          for (let i = 0; i < d.length; i += 4) {
            d[i] = Math.min(255, d[i] * 1.06 + 8);
            d[i+1] = Math.min(255, d[i+1] * 1.04 + 6);
            d[i+2] = Math.min(255, d[i+2] * 1.04 + 6);
          }
          ctx.putImageData(imgData, 0, 0);
        }
      }

      // Soft Halation Bloom Layer
      if (currentPhotoStyle === 'halation' || currentPhotoStyle === 'disposable') {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = 0.22;
        ctx.drawImage(raw, 0, 0);
        ctx.restore();
      }

      // Vignette
      ctx.save();
      const vig = ctx.createRadialGradient(w/2, h/2, w*0.35, w/2, h/2, w*0.75);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.38)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);
      ctx.restore();

      return c;
    }

    // DRAW THEMED BORDER DETAILS
    function drawThemedBackground(ctx, w, h, theme) {
      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, w, h);

      if (theme.id === 'ribbons') {
        ctx.fillStyle = 'rgba(255, 133, 170, 0.15)';
        for (let y = 20; y < h; y += 40) {
          ctx.beginPath();
          ctx.arc(20, y, 3, 0, Math.PI * 2);
          ctx.arc(w - 20, y, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (theme.id === 'lace') {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        const r = 10;
        for (let y = r; y < h; y += r * 2) {
          ctx.beginPath();
          ctx.arc(28, y, r, -Math.PI/2, Math.PI/2);
          ctx.arc(w - 28, y, r, Math.PI/2, -Math.PI/2);
          ctx.fill();
        }
      } else if (theme.id === 'strawberry') {
        ctx.font = '24px sans-serif';
        for (let y = 40; y < h - 40; y += 140) {
          ctx.fillText('🍓', 10, y);
          ctx.fillText('🍓', w - 36, y + 70);
        }
      } else if (theme.id === 'teddy') {
        ctx.fillStyle = '#ddb892';
        for (let y = 30; y < h; y += 60) {
          ctx.beginPath();
          ctx.arc(18, y, 4, 0, Math.PI * 2);
          ctx.arc(w - 18, y, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (theme.id === 'sakura') {
        ctx.fillStyle = '#fbcfe8';
        for (let i = 0; i < 30; i++) {
          const px = ((i * 123) % (w - 40)) + 20;
          const py = ((i * 241) % (h - 40)) + 20;
          ctx.beginPath();
          ctx.ellipse(px, py, 6, 12, (i * 0.4), 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (theme.id === 'chromestars') {
        ctx.fillStyle = '#38bdf8';
        for (let y = 40; y < h; y += 120) {
          ctx.font = '22px sans-serif';
          ctx.fillText('✦', 14, y);
          ctx.fillText('✦', w - 32, y + 60);
        }
      } else if (theme.id === 'film35') {
        ctx.fillStyle = '#ffffff';
        for (let y = 30; y < h - 40; y += 44) {
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(12, y, 16, 24, 4);
            ctx.roundRect(w - 28, y, 16, 24, 4);
          } else {
            ctx.rect(12, y, 16, 24);
            ctx.rect(w - 28, y, 16, 24);
          }
          ctx.fill();
        }
        ctx.font = '700 13px monospace';
        ctx.fillStyle = '#f59e0b';
        ctx.fillText('PORTRA 400', 36, 26);
        ctx.fillText('SAFETY FILM', w - 130, 26);
      } else if (theme.id === 'winter') {
        ctx.fillStyle = '#93c5fd';
        for (let i = 0; i < 40; i++) {
          const sx = ((i * 111) % (w - 40)) + 20;
          const sy = ((i * 213) % (h - 40)) + 20;
          ctx.font = '16px sans-serif';
          ctx.fillText('❄', sx, sy);
        }
      }
    }

    function drawDecoratedPhoto(ctx, img, x, y, w, h, theme) {
      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, 18);
      else ctx.rect(x, y, w, h);
      ctx.clip();
      ctx.drawImage(img, x, y, w, h);
      ctx.restore();

      if (theme.id === 'ribbons') {
        ctx.font = '32px sans-serif';
        ctx.fillText('🎀', x - 10, y + 14);
        ctx.fillText('🎀', x + w - 24, y + 14);
      } else if (theme.id === 'teddy') {
        ctx.font = '26px sans-serif';
        ctx.fillText('🧸', x + w - 30, y + h - 6);
      } else if (theme.id === 'cherry') {
        ctx.font = '28px sans-serif';
        ctx.fillText('🍒', x + w - 26, y + 14);
      } else if (theme.id === 'gallery') {
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x - 6, y - 6, w + 12, h + 12);
      } else if (theme.id === 'angelwings') {
        ctx.font = '26px sans-serif';
        ctx.fillText('🪽', x - 14, y + 14);
        ctx.fillText('🪽', x + w - 16, y + 14);
      }
    }

    function drawOurFooter(ctx, posX, totalH, footerH, theme) {
      ctx.textAlign = 'center';
      const startY = totalH - footerH + 52;

      ctx.font = '700 34px -apple-system, sans-serif';
      ctx.fillStyle = theme.text;
      const title = (titleInput.value || 'BB & AU').toUpperCase();
      ctx.fillText(`♥ ${title} ♥`, posX, startY);

      ctx.font = '500 18px -apple-system, sans-serif';
      ctx.fillStyle = theme.text;
      ctx.globalAlpha = 0.8;
      const subtitle = (subtitleInput.value || 'OUR MEMORIES').toUpperCase();
      const today = new Date().toISOString().slice(0, 10).replace(/-/g, '.');
      ctx.fillText(`${today} • ${subtitle}`, posX, startY + 36);
      ctx.globalAlpha = 1.0;

      const barY = startY + 54;
      ctx.fillStyle = theme.text;
      for (let b = -100; b < 100; b += 7) {
        ctx.fillRect(posX + b, barY, (b % 14 === 0 ? 3 : 1.5), 20);
      }
    }

    function buildStudioCollage() {
      const themes = BORDER_THEMES[currentMood] || [];
      const theme = themes.find(t => t.id === currentThemeId) || themes[0];

      const padding = (theme.id === 'film35') ? 56 : 42;
      const gap = 20;
      const photoW = 760;
      const photoH = 570;
      const footerH = 175;
      const ctx = renderCanvas.getContext('2d');

      const processed = rawCapturedFrames.map(f => processPhoto(f));

      if (currentLayout === 'strip') {
        renderCanvas.width = photoW + (padding * 2);
        renderCanvas.height = (photoH * 4) + (gap * 3) + (padding * 2) + footerH;
        drawThemedBackground(ctx, renderCanvas.width, renderCanvas.height, theme);

        processed.forEach((f, idx) => {
          drawDecoratedPhoto(ctx, f, padding, padding + (idx * (photoH + gap)), photoW, photoH, theme);
        });
        drawOurFooter(ctx, renderCanvas.width / 2, renderCanvas.height, footerH, theme);

      } else if (currentLayout === 'twin') {
        const stripW = photoW + (padding * 2);
        renderCanvas.width = (stripW * 2) + 20;
        renderCanvas.height = (photoH * 4) + (gap * 3) + (padding * 2) + footerH;
        drawThemedBackground(ctx, renderCanvas.width, renderCanvas.height, theme);

        [0, stripW + 20].forEach(offset => {
          processed.forEach((f, idx) => {
            drawDecoratedPhoto(ctx, f, offset + padding, padding + (idx * (photoH + gap)), photoW, photoH, theme);
          });
          drawOurFooter(ctx, offset + (stripW / 2), renderCanvas.height, footerH, theme);
        });

      } else if (currentLayout === 'grid') {
        renderCanvas.width = (photoW * 2) + (padding * 2) + gap;
        renderCanvas.height = (photoH * 2) + (padding * 2) + gap + footerH;
        drawThemedBackground(ctx, renderCanvas.width, renderCanvas.height, theme);

        processed.forEach((f, idx) => {
          const col = idx % 2;
          const row = Math.floor(idx / 2);
          const x = padding + (col * (photoW + gap));
          const y = padding + (row * (photoH + gap));
          drawDecoratedPhoto(ctx, f, x, y, photoW, photoH, theme);
        });
        drawOurFooter(ctx, renderCanvas.width / 2, renderCanvas.height, footerH, theme);

      } else if (currentLayout === 'polaroid') {
        renderCanvas.width = photoW + (padding * 2);
        renderCanvas.height = photoH + padding + 220;
        drawThemedBackground(ctx, renderCanvas.width, renderCanvas.height, theme);
        if (processed[0]) drawDecoratedPhoto(ctx, processed[0], padding, padding, photoW, photoH, theme);
        drawOurFooter(ctx, renderCanvas.width / 2, renderCanvas.height, 200, theme);
      }

      placedStickers.forEach(s => {
        ctx.font = '54px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(s.emoji, s.x, s.y);
      });

      if (doodleCanvas.width > 0) {
        ctx.drawImage(doodleCanvas, 0, 0, renderCanvas.width, renderCanvas.height);
      }

      previewImg.src = renderCanvas.toDataURL('image/png');
      updateThumbs();
    }

    // Stickers
    document.querySelectorAll('.sticker-item').forEach(st => {
      st.addEventListener('click', () => {
        placedStickers.push({
          emoji: st.dataset.emoji,
          x: renderCanvas.width / 2 + (Math.random() * 200 - 100),
          y: renderCanvas.height / 2 + (Math.random() * 300 - 150)
        });
        buildStudioCollage();
      });
    });

    // Doodle Pen
    doodleToggleBtn.addEventListener('click', () => {
      doodleMode = !doodleMode;
      doodleCanvas.classList.toggle('active', doodleMode);
      doodleToggleBtn.classList.toggle('active', doodleMode);
      if (doodleMode) {
        doodleCanvas.width = renderCanvas.width;
        doodleCanvas.height = renderCanvas.height;
      } else {
        buildStudioCollage();
      }
    });

    const dCtx = doodleCanvas.getContext('2d');
    function getTouchPos(e) {
      const rect = doodleCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (doodleCanvas.width / rect.width),
        y: (clientY - rect.top) * (doodleCanvas.height / rect.height)
      };
    }

    ['mousedown', 'touchstart'].forEach(ev => doodleCanvas.addEventListener(ev, (e) => {
      isDrawing = true;
      const pos = getTouchPos(e);
      dCtx.beginPath();
      dCtx.moveTo(pos.x, pos.y);
      dCtx.strokeStyle = '#ff4d88';
      dCtx.lineWidth = 7;
      dCtx.lineCap = 'round';
    }));

    ['mousemove', 'touchmove'].forEach(ev => doodleCanvas.addEventListener(ev, (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getTouchPos(e);
      dCtx.lineTo(pos.x, pos.y);
      dCtx.stroke();
    }));

    ['mouseup', 'touchend'].forEach(ev => doodleCanvas.addEventListener(ev, () => {
      isDrawing = false;
      buildStudioCollage();
    }));

    retakeAllBtn.addEventListener('click', () => {
      placedStickers = [];
      dCtx.clearRect(0, 0, doodleCanvas.width, doodleCanvas.height);
      studioModal.classList.remove('active');
    });

    // Save & Share via iOS
    saveShareBtn.addEventListener('click', () => {
      renderCanvas.toBlob(async (blob) => {
        const file = new File([blob], `our_photobooth_${Date.now()}.png`, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: 'Our Photo Strip',
              text: 'Memories from our Photobooth!'
            });
            return;
          } catch (err) {
            if (err.name !== 'AbortError') console.error(err);
          }
        }
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `our_photobooth_${Date.now()}.png`;
        link.click();
      }, 'image/png');
    });

    // Start
    renderMoodButtons();
    startCamera();
  </script>
</body>
</html>
